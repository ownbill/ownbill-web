server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain;

  if ($host = www.ownbill.in) { return 301 https://ownbill.in$request_uri; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  location ~ /\.(?!well-known/) { deny all; }
  location = /nginx.conf { deny all; }
  location = /docker-compose.yml { deny all; }

  location = /privacy.html { return 301 /privacy/; }
  location = /terms.html { return 301 /terms/; }
  location = /delete-account.html { return 301 /delete-account/; }

  location /l/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src https://lkurxhcdvrvlahdjtivp.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    try_files $uri $uri/ /l/index.html;
  }

  location /assets/ { expires 30d; add_header Cache-Control "public" always; add_header X-Content-Type-Options nosniff always; }
  location /img/ { expires 30d; add_header Cache-Control "public" always; add_header X-Content-Type-Options nosniff always; }

  location / { try_files $uri $uri/ =404; }
  error_page 404 /404.html;
}
