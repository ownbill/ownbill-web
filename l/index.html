<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src https://lkurxhcdvrvlahdjtivp.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Statement</title>
<style>@font-face{font-family:Geist;src:url(/assets/fonts/Geist-400.woff2) format("woff2");font-weight:400;font-display:swap}@font-face{font-family:Geist;src:url(/assets/fonts/Geist-600.woff2) format("woff2");font-weight:600 800;font-display:swap}</style>
<style>
:root{
  --bg:#F4F3EF;--card:#FFFFFF;--line:#E2DFD8;--ink:#0E1014;--muted:#565A66;--faint:#62666F;
  --plum:#0E1014;--plum-hi:#272B33;--mari-soft:#FFF3DA;--mari-text:#8A5300;--mari-deep:#5C3A00;
  --green:#1E7A4C;--green-soft:#E5F5EC;--red:#B3261E;--pay:#1E7A4C;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1014;--card:#181B21;--line:#2A2E36;--ink:#F4F3EF;--muted:#B5B8C0;--faint:#959AA4;
    --plum:#3DDC97;--plum-hi:#6BE6B0;--mari-soft:#2C210C;--mari-text:#FFC24D;--mari-deep:#F0D9A8;
    --green:#66C892;--green-soft:#13261B;--red:#F2786D;--pay:#1E7A4C;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Geist,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:20px;min-height:100vh}
[hidden]{display:none!important}
a{color:var(--plum)}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:18px 20px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:14px;background:#0E1014;color:#3DDC97;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.biz{display:block;font-size:18px;line-height:24px;font-weight:800;overflow-wrap:anywhere}
.for{display:block;font-size:12px;line-height:17px;color:var(--faint)}
.pfor{display:none}
.bal{margin:16px 16px 0;padding:18px;border-radius:20px;background:var(--mari-soft);color:var(--mari-text)}
.bal.settled,.bal.advance{background:var(--green-soft);color:var(--green)}
.bal .l{display:block;font-size:14px;font-weight:700}
.bal .a{display:block;font-size:38px;line-height:46px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bal.settled .l{font-size:24px;line-height:32px;font-weight:800}
.bal .asof{display:block;font-size:12px;line-height:17px}
.btn{height:54px;border-radius:16px;font-family:inherit;font-weight:800;font-size:16px;line-height:1;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:transform .14s cubic-bezier(.2,.8,.2,1);-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid #3DDC97;outline-offset:2px}
.pay{margin-top:14px;background:var(--pay);color:#fff;box-shadow:0 10px 24px rgba(30,122,76,.25)}
.paynote{display:block;margin-top:8px;font-size:12px;line-height:17px;color:var(--mari-deep)}
h2{margin:18px 20px 6px;font-size:12px;line-height:16px;font-weight:700;letter-spacing:.6px;color:var(--faint);text-transform:uppercase}
.list{margin:0 16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:0 14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.grow{flex-grow:1;min-width:0}
.row .t{display:block;font-size:14px;font-weight:700;overflow-wrap:anywhere}
.row .s{display:block;font-size:12px;line-height:17px;color:var(--faint)}
.amt{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.good{color:var(--green)}
.empty{padding:20px 0;color:var(--faint);text-align:center}
.ghost{margin:14px 16px 0;height:52px;border:1.5px solid var(--line);background:var(--card);color:var(--plum);font-size:15px}
footer{margin-top:auto;padding:16px 20px 20px;text-align:center;font-size:12px;line-height:17px;color:var(--faint)}
.state{flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:8px}
.state .ic{width:64px;height:64px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.state h1{margin:0;font-size:20px;line-height:26px;font-weight:800}
.state p{margin:0;color:var(--muted);max-width:300px}
.state .ghost{margin:12px 0 0;padding:0 28px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:#3DDC97;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media print{
  :root{--bg:#fff;--card:#fff;--line:#ccc;--ink:#000;--muted:#333;--faint:#444;--green:#000;--mari-text:#000;--mari-soft:#fff;--green-soft:#fff}
  body{background:#fff;font-size:12px}
  .wrap{max-width:none}
  .pay,.paynote,.ghost,.av,#ask{display:none!important}
  header{border-bottom:2px solid #000;padding:0 0 10px}
  .pfor{display:block;font-size:11px;color:#333}
  .bal{margin:12px 0 0;padding:10px 0;border-radius:0;border-bottom:1px solid #ccc}
  .bal .a{font-size:26px;line-height:32px}
  h2{margin:14px 0 4px}
  .list{margin:0;border:0;padding:0}
  .row{break-inside:avoid;padding:6px 0}
  footer{padding:14px 0 0;text-align:left}
}
</style>
<script src="statement.js" defer></script>
</head>
<body>
<div class="wrap">
  <main id="loading" class="state" aria-live="polite">
    <div class="spin" role="presentation"></div>
    <p>Loading your statement&hellip;</p>
  </main>

  <main id="gone" class="state" hidden>
    <div class="ic" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--plum)"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/><path d="M4 4l16 16"/></svg>
    </div>
    <h1>Link turned off or not found</h1>
    <p>This statement link is not working now. Ask the shop to send you a new link.</p>
  </main>

  <main id="offline" class="state" hidden>
    <div class="ic" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--plum)"><path d="M2 8.5a15 15 0 0120 0M5.5 12a10 10 0 0113 0M9 15.5a5 5 0 016 0"/><path d="M12 19h.01"/><path d="M3 3l18 18"/></svg>
    </div>
    <h1>Could not load</h1>
    <p id="offmsg">Check your internet and try again.</p>
    <button id="retry" class="btn ghost" type="button">Try again</button>
  </main>

  <div id="page" hidden style="display:flex;flex-direction:column;flex-grow:1">
    <header>
      <span id="av" class="av" aria-hidden="true"></span>
      <span>
        <span id="biz" class="biz"></span>
        <span id="for" class="for"></span>
        <span id="pfor" class="pfor"></span>
      </span>
    </header>

    <section id="bal" class="bal" aria-live="polite">
      <span id="blabel" class="l"></span>
      <span id="bamount" class="a"></span>
      <span id="asof" class="asof"></span>
      <a id="pay" class="btn pay" href="#" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2.5"/><path d="M9 12l2 2 4-4"/></svg>
        <span id="paytext"></span>
      </a>
      <span id="paynote" class="paynote" hidden></span>
    </section>

    <h2>Bills and payments</h2>
    <div id="rows" class="list"></div>

    <button id="dl" class="btn ghost" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      Download statement
    </button>

    <footer><span id="ask"></span><br>Shared using OwnBill</footer>
  </div>
</div>
</body>
</html>
