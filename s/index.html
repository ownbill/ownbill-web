<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src https://lkurxhcdvrvlahdjtivp.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Catalogue</title>
<style>@font-face{font-family:Geist;src:url(/assets/fonts/Geist-400.woff2) format("woff2");font-weight:400;font-display:swap}@font-face{font-family:Geist;src:url(/assets/fonts/Geist-600.woff2) format("woff2");font-weight:600 800;font-display:swap}</style>
<style>
:root{--bg:#F3F6FB;--card:#fff;--line:#E2E7F0;--ink:#111A2E;--muted:#5A6378;--faint:#7F899E;--blue:#1D5BF0;--blue-lo:#1440B8;--blue-soft:#E8F0FF;--green:#0E7A4A;--wa:#1E7A4C;--red:#B42318}
@media (prefers-color-scheme: dark){:root{--bg:#0A0F1C;--card:#121A2E;--line:#243049;--ink:#EEF2FA;--muted:#AEB8CC;--faint:#8A95AD;--blue:#5B8CFF;--blue-lo:#3B66D8;--blue-soft:#17264A;--green:#5FD49B;--red:#FF8A7A}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Geist,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:20px;min-height:100vh}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:110px}
header{background:var(--blue);color:#fff;padding:20px 18px 22px;border-radius:0 0 26px 26px}
.biz{font-size:21px;line-height:27px;font-weight:800;overflow-wrap:anywhere}
.sub{font-size:13px;opacity:.85;margin-top:2px}
.note{margin-top:10px;font-size:13px;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px}
.tools{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 16px 8px}
input[type=search]{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:0 14px}
input[type=search]:focus{outline:3px solid var(--blue-soft);border-color:var(--blue)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.cats button{flex:0 0 auto;height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.cats button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
h2{margin:16px 20px 6px;font-size:13px;font-weight:800;color:var(--faint)}
.list{margin:0 16px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.n{display:block;font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.d{display:block;font-size:12px;color:var(--faint)}
.p{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.mrp{display:block;font-size:11.5px;color:var(--faint);text-decoration:line-through;text-align:right}
.out{font-size:12px;font-weight:700;color:var(--red)}
.q{display:flex;align-items:center;gap:6px}
.q button{width:36px;height:36px;border-radius:12px;border:0;background:var(--blue-soft);color:var(--blue);font:inherit;font-size:20px;font-weight:800;cursor:pointer}
.q b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.add,.q button.add{width:auto;height:36px;padding:0 16px;border-radius:12px;border:1.5px solid var(--blue);background:var(--card);color:var(--blue);font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(17,26,46,.10)}
.bar .in{max-width:608px;margin:0 auto}
.btn{width:100%;height:56px;border-radius:18px;border:0;background:var(--wa);color:#fff;font:inherit;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-decoration:none}
.btn[aria-disabled=true]{opacity:.5;pointer-events:none}
.sum{display:block;text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.empty{padding:24px;text-align:center;color:var(--faint)}
.state{flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px;gap:8px}
.state h1{margin:0;font-size:20px;font-weight:800}
.state p{margin:0;color:var(--muted);max-width:320px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--faint);font-size:12px;padding:18px}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="store.js" defer></script>
</head>
<body>
<div class="wrap">
  <main id="loading" class="state" aria-live="polite"><div class="spin" role="presentation"></div><p>Loading the catalogue&hellip;</p></main>
  <main id="gone" class="state" hidden><h1>Catalogue not found</h1><p>This link is turned off or wrong. Ask the shop for a new link.</p></main>
  <main id="offline" class="state" hidden><h1>Could not load</h1><p>Check your internet and try again.</p><button id="retry" class="add" type="button">Try again</button></main>
  <div id="page" hidden>
    <header><div id="biz" class="biz"></div><div id="sub" class="sub"></div><div id="note" class="note" hidden></div></header>
    <div class="tools">
      <input id="q" type="search" placeholder="Search items" aria-label="Search items" autocomplete="off">
      <div id="cats" class="cats" role="toolbar" aria-label="Categories"></div>
    </div>
    <div id="items"></div>
    <footer>Prices and stock as set by the shop. Made with OwnBill.</footer>
  </div>
</div>
<div id="bar" class="bar" hidden>
  <div class="in">
    <span id="sum" class="sum"></span>
    <a id="send" class="btn" href="#" target="_blank" rel="noopener noreferrer" aria-disabled="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.3-.4.7-1.3a.5.5 0 000-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.7 11.8 11.8 0 004.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 001.8-1.2 2.2 2.2 0 00.1-1.2c0-.1-.2-.2-.4-.3z"/></svg>
      <span id="sendt">Send order on WhatsApp</span>
    </a>
  </div>
</div>
</body>
</html>
